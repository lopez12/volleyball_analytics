# Ruff (lint + format) config. Dev-only tool: nothing in the build imports ruff.
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "data"]

[lint]
select = ["E", "W", "F", "I", "B", "UP"]
# The formatter owns line length; long HTML/f-string literals are left alone.
ignore = ["E501"]

[lint.isort]
known-first-party = ["analytics", "db", "renderer"]

[format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
