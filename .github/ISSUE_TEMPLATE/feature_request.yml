name: Feature request
description: Propose a new report, page, CLI capability, or enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describe the problem first, then the proposed change.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What need or gap does this address?
      placeholder: Add the problem or motivation here...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the proposed change in detail.
      placeholder: Add the details of the proposed change here...
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Which layer does this touch?
      description: Best guess is fine.
      multiple: true
      options:
        - Log grammar (new/changed token)
        - Engine (analytics.py)
        - Persistence (db.py)
        - Rendering / HTML
        - Author UI (logger/)
        - Tooling / CI
        - Not sure
    validations:
      required: true
  - type: textarea
    id: compat
    attributes:
      label: Backward-compatibility impact
      description: Is there something needed to be considered for backward compatibility?
      placeholder: Add any notes about backward compatibility here...
    validations:
      required: false
