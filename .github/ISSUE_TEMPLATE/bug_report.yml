name: Bug report
description: Report a defect in a report, page, or the build.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the fields below so it can be reproduced quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short, clear description of the problem.
      placeholder: Add the summary of the bug here...
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Affected dataset
      description: If there is an affected dataset, specify it here. (optional)
      placeholder: Reference the affected dataset here...
    validations:
      required: false
  - type: input
    id: page
    attributes:
      label: Affected match / page
      description: If there is an affected match file or page, specify it here. (optional)
      placeholder: Reference the affected match file or page here...
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What are the steps to reproduce the bug?
      placeholder: |
        Example:
        1. Run `python generate.py`
        2. Open docs/nova/amistosos/player_7.html
        3. Look at the "Ataque" row
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The expected behavior is...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Instead it shows...
    validations:
      required: true
  - type: checkboxes
    id: verified
    attributes:
      label: Verification
      options:
        - label: I ran `python generate.py` locally or checked the published GitHub Pages page.
          required: true
